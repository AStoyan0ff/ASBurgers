<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" class="auth-screen-html">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-screen">
<div class="auth-bg">
    <img th:src="@{/images/loginForm.png}" alt="AS Burgers">
</div>

<main class="auth-page auth-page--screen">
    <div class="auth-layout">
        <h1 class="auth-screen-title">Welcome back</h1>

        <div class="auth-card">
            <p class="auth-error" th:if="${loginError}" th:text="${loginError}"></p>

            <form class="auth-form auth-form--glass"
                  th:action="@{/auth/login}"
                  method="post"
                  th:object="${loginRequest}">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" type="text" th:field="*{username}" required autocomplete="username">
                    <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" th:field="*{password}" required autocomplete="current-password">
                    <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                </div>

                <button type="submit" class="btn-pill btn-pill--gold btn-pill--block">Login</button>
            </form>

            <a class="btn-pill btn-pill--silver btn-pill--block" th:href="@{/auth/register}">Create account</a>
        </div>
    </div>
</main>

</body>
</html>
