<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" class="auth-screen-html">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-screen">
<div class="auth-bg">
    <img th:src="@{/images/registerForm.png}" alt="ASBurgers">
</div>

<main class="auth-page auth-page--screen">
    <div class="auth-layout">
        <h1 class="auth-screen-title">Create your account</h1>

        <div class="auth-card">
            <p class="auth-error" th:if="${registerError}" th:text="${registerError}"></p>

            <form class="auth-form auth-form--glass"
                  th:action="@{/auth/register}"
                  method="post"
                  th:object="${registerRequest}">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" type="text" th:field="*{username}" required autocomplete="username">
                    <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" th:field="*{email}" required autocomplete="email">
                    <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" th:field="*{password}" required autocomplete="new-password">
                    <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input id="address" type="text" th:field="*{address}" required autocomplete="street-address">
                    <p class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></p>
                </div>

                <button type="submit" class="btn-pill btn-pill--gold btn-pill--block">Register</button>
            </form>

            <a class="btn-pill btn-pill--silver btn-pill--block" th:href="@{/auth/login}">Login</a>
        </div>
    </div>
</main>

</body>
</html>
