<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><body><nav th:fragment="navbar" class="site-nav">    <a class="site-nav__brand" th:href="@{/}">AS Burgers</a>    <div class="site-nav__links">        <a class="btn-pill btn-pill--silver btn-pill--nav" th:href="@{/}">Home</a>        <a th:if="${session.userId != null}"           th:href="@{/burgers}"           th:class="${currentPage == 'burgers'}                ? 'btn-pill btn-pill--gold btn-pill--nav is-active'                : 'btn-pill btn-pill--silver btn-pill--nav'">            Burgers        </a>        <a th:if="${session.userId != null}"           th:href="@{/orders/my}"           th:class="${currentPage == 'orders'}                ? 'btn-pill btn-pill--gold btn-pill--nav is-active'                : 'btn-pill btn-pill--silver btn-pill--nav'">            My Orders        </a>        <a th:if="${session.userId != null}"           th:href="@{/orders/order-history}"           th:class="${currentPage == 'order-history'}                ? 'btn-pill btn-pill--gold btn-pill--nav is-active'                : 'btn-pill btn-pill--silver btn-pill--nav'">            Order History        </a>        <a th:if="${session.userId != null}"           class="btn-pill btn-pill--silver btn-pill--nav"           th:href="@{/auth/logout}">            Logout        </a>        <a th:if="${session.userId == null}"           class="btn-pill btn-pill--gold btn-pill--nav"           th:href="@{/auth/register}">            Register        </a>        <a th:if="${session.userId == null}"           class="btn-pill btn-pill--silver btn-pill--nav"           th:href="@{/auth/login}">            Login        </a>    </div></nav></body></html>
